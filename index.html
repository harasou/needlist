<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>needlist</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #4a90e2;
      --bg: #f2f2f7;
      --border: #e5e5ea;
      --muted: #8e8e93;
      --muted2: #c7c7cc;
      --red: #ff3b30;
      --text: #1c1c1e;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Helvetica Neue', sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 600px;
      margin: 0 auto;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── Tabs ── */
    .header {
      background: rgba(242,242,247,0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 20;
      padding-top: env(safe-area-inset-top, 0);
    }

    .tabs {
      display: flex;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }

    .tab {
      flex-shrink: 0;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color .15s, border-color .15s;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    .tab.active { color: var(--blue); border-bottom-color: var(--blue); }

    .tab-add {
      flex-shrink: 0;
      padding: 10px 16px 12px;
      font-size: 24px;
      font-weight: 300;
      color: var(--blue);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Main list ── */
    .main {
      flex: 1;
      padding: 16px 12px 8px;
      overflow-y: auto;
    }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: .6px;
      text-transform: uppercase;
      padding: 0 4px 6px;
    }

    .group {
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .item {
      background: #fff;
      display: flex;
      align-items: center;
      border-top: 1px solid var(--border);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      transition: background .1s;
      min-height: 54px;
    }
    .group .item:first-child { border-top: none; }
    .item:active { background: #f0f0f5; }

    .item-icon {
      width: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: var(--muted2);
      flex-shrink: 0;
      align-self: stretch;
    }
    .item.checked .item-icon { color: var(--blue); }

    .item-body {
      flex: 1;
      padding: 14px 8px 14px 0;
      min-width: 0;
    }

    .item-text {
      font-size: 16px;
      line-height: 1.35;
    }
    .item.checked .item-text { color: var(--muted); }

    .item-meta {
      font-size: 12px;
      color: var(--muted2);
      margin-top: 2px;
    }

    .item-more {
      background: none;
      border: none;
      padding: 0 14px;
      cursor: pointer;
      color: var(--muted2);
      font-size: 20px;
      align-self: stretch;
      display: flex;
      align-items: center;
      -webkit-tap-highlight-color: transparent;
    }
    .item-more:active { color: var(--muted); }

    /* ── Add bar ── */
    .add-bar {
      padding: 8px 12px;
      padding-bottom: calc(8px + env(safe-area-inset-bottom, 0));
      background: rgba(242,242,247,0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
    }

    .add-form {
      display: flex;
      background: #fff;
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .add-input {
      flex: 1;
      border: none;
      outline: none;
      padding: 13px 14px;
      font-size: 16px;
      font-family: inherit;
      background: transparent;
      color: var(--text);
    }
    .add-input::placeholder { color: var(--muted2); }

    .add-btn {
      background: none;
      border: none;
      border-left: 1px solid var(--border);
      padding: 0 18px;
      cursor: pointer;
      color: var(--blue);
      font-size: 24px;
      font-weight: 300;
      display: flex;
      align-items: center;
      -webkit-tap-highlight-color: transparent;
    }
    .add-btn:active { background: var(--bg); }

    /* ── Empty ── */
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: calc(72px + env(safe-area-inset-bottom, 0));
      left: 50%;
      transform: translateX(-50%);
      background: #1c1c1e;
      color: #fff;
      border-radius: 14px;
      padding: 13px 6px 13px 16px;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 14px;
      z-index: 100;
      box-shadow: 0 6px 24px rgba(0,0,0,.28);
      white-space: nowrap;
      max-width: calc(100vw - 32px);
      overflow: hidden;
      animation: toast-in .2s ease;
    }
    @keyframes toast-in {
      from { opacity: 0; transform: translateX(-50%) translateY(12px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    .toast-text {
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .toast-undo {
      background: none;
      border: none;
      color: #64d2ff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 8px;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .toast-undo:active { background: rgba(255,255,255,.12); }

    .toast-bar {
      position: absolute;
      bottom: 0; left: 0;
      height: 3px;
      background: #64d2ff;
      border-radius: 0 0 14px 14px;
      animation: shrink 5s linear forwards;
    }
    @keyframes shrink { from { width: 100%; } to { width: 0%; } }

    /* ── Modal ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 50;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      animation: fade-in .15s ease;
    }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

    @media (min-width: 480px) {
      .overlay { align-items: center; }
      .modal { border-radius: 16px; max-width: 420px; }
    }

    .modal {
      background: #fff;
      border-radius: 20px 20px 0 0;
      padding: 24px 20px;
      padding-bottom: calc(24px + env(safe-area-inset-bottom, 0));
      width: 100%;
      animation: slide-up .2s ease;
    }
    @keyframes slide-up {
      from { transform: translateY(40px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    .modal-title {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .modal-input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 16px;
      font-family: inherit;
      outline: none;
      color: var(--text);
      transition: border-color .15s;
    }
    .modal-input:focus { border-color: var(--blue); }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      align-items: center;
    }
    .modal-spacer { flex: 1; }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 11px 18px;
      font-size: 15px;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: opacity .1s;
    }
    .btn:active { opacity: .75; }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-cancel  { background: var(--bg); color: var(--text); }
    .btn-danger  { background: transparent; color: var(--red); padding-left: 0; }

    .hint {
      text-align: center;
      padding: 16px 0 4px;
      font-size: 12px;
      color: var(--muted2);
    }
  </style>
</head>
<body>

<div class="header">
  <div class="tabs" id="tabs"></div>
</div>

<div class="main" id="main"></div>

<div class="add-bar">
  <form class="add-form" id="add-form">
    <input class="add-input" id="add-input" type="text" placeholder="アイテムを追加..." autocomplete="off">
    <button class="add-btn" type="submit">＋</button>
  </form>
</div>

<script>
const KEY = 'cl_v2';
let s = { lists: [], items: {}, active: null };
let pending = null; // { timer, lid, iid, ts, el }

// ── Storage ──────────────────────────────────────────────
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d?.lists?.length) {
      s = d;
      if (!s.active || !s.lists.find(l => l.id === s.active))
        s.active = s.lists[0].id;
    } else {
      init();
    }
  } catch { init(); }
}

function init() {
  const id = uid();
  s = { lists: [{ id, name: '買い物リスト' }], items: { [id]: [] }, active: id };
  save();
}

function save() { localStorage.setItem(KEY, JSON.stringify(s)); }
function uid()  { return crypto.randomUUID?.() ?? Math.random().toString(36).slice(2) + Date.now(); }

// ── Sort ─────────────────────────────────────────────────
function sorted(items) {
  return items.map((item, i) => ({ item, i }))
    .sort((a, b) => {
      if (a.item.checked !== b.item.checked) return a.item.checked ? -1 : 1;
      return a.i - b.i;
    })
    .map(({ item }) => item);
}

// ── Toggle ───────────────────────────────────────────────
function toggle(lid, iid) {
  const item = s.items[lid]?.find(i => i.id === iid);
  if (!item) return;

  if (item.checked) {
    commitPending(); // commit any previous pending
    item.checked = false;
    const ts = new Date().toISOString();
    save();
    render();
    showToast(item.text, lid, iid, ts);
  } else {
    item.checked = true;
    save();
    render();
  }
}

// ── Toast ────────────────────────────────────────────────
function commitPending() {
  if (!pending) return;
  clearTimeout(pending.timer);
  pending.el.remove();
  const item = s.items[pending.lid]?.find(i => i.id === pending.iid);
  if (item && !item.checked) { item.uncheckHistory.push(pending.ts); save(); }
  pending = null;
}

function showToast(text, lid, iid, ts) {
  // Remove existing toast immediately
  document.querySelector('.toast')?.remove();
  if (pending) { clearTimeout(pending.timer); pending = null; }

  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML =
    `<span class="toast-text">「${esc(text)}」を購入済みに</span>` +
    `<button class="toast-undo">取り消し</button>` +
    `<div class="toast-bar"></div>`;
  document.body.appendChild(el);

  const commit = () => {
    el.remove();
    const item = s.items[lid]?.find(i => i.id === iid);
    if (item && !item.checked) { item.uncheckHistory.push(ts); save(); render(); }
    pending = null;
  };
  const undo = () => {
    clearTimeout(pending?.timer);
    el.remove();
    const item = s.items[lid]?.find(i => i.id === iid);
    if (item) { item.checked = true; save(); render(); }
    pending = null;
  };

  el.querySelector('.toast-undo').addEventListener('click', e => { e.stopPropagation(); undo(); });

  const timer = setTimeout(commit, 5000);
  pending = { timer, lid, iid, ts, el };
}

// ── Modal ────────────────────────────────────────────────
function modal({ title, value = '', placeholder = '', onSave, onDelete }) {
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML =
    `<div class="modal">` +
      `<div class="modal-title">${esc(title)}</div>` +
      `<input class="modal-input" type="text" value="${esc(value)}" placeholder="${esc(placeholder)}">` +
      `<div class="modal-actions">` +
        (onDelete ? `<button class="btn btn-danger" id="_del">削除</button>` : '') +
        `<div class="modal-spacer"></div>` +
        `<button class="btn btn-cancel" id="_cancel">キャンセル</button>` +
        `<button class="btn btn-primary" id="_save">保存</button>` +
      `</div>` +
    `</div>`;

  const inp = ov.querySelector('.modal-input');
  const close = () => ov.remove();
  const doSave = () => { const v = inp.value.trim(); if (v) { onSave(v); close(); } };

  ov.querySelector('#_cancel').onclick = close;
  ov.querySelector('#_save').onclick = doSave;
  ov.querySelector('#_del')?.addEventListener('click', () => { onDelete(); close(); });
  ov.addEventListener('click', e => { if (e.target === ov) close(); });
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') doSave();
    if (e.key === 'Escape') close();
  });

  document.body.appendChild(ov);
  requestAnimationFrame(() => { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); });
}

// ── Render ───────────────────────────────────────────────
function render() { renderTabs(); renderMain(); }

function renderTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML =
    s.lists.map(l =>
      `<div class="tab${l.id === s.active ? ' active' : ''}" data-lid="${l.id}">${esc(l.name)}</div>`
    ).join('') +
    `<div class="tab-add" id="btn-new">＋</div>`;

  tabs.querySelectorAll('.tab[data-lid]').forEach(t => {
    let pressTimer = null;
    let startX = 0, startY = 0;

    t.addEventListener('pointerdown', e => {
      if (e.button > 0) return;
      e.preventDefault();
      t.setPointerCapture(e.pointerId);
      startX = e.clientX; startY = e.clientY;
      pressTimer = setTimeout(() => { pressTimer = null; openListModal(t.dataset.lid); }, 600);
    });
    t.addEventListener('pointerup', () => {
      if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; s.active = t.dataset.lid; render(); }
    });
    t.addEventListener('pointermove', e => {
      if (!pressTimer) return;
      const dx = e.clientX - startX, dy = e.clientY - startY;
      if (dx*dx + dy*dy > 100) { clearTimeout(pressTimer); pressTimer = null; }
    });
    // pointercancel intentionally not handled: on Android, contextmenu fires ~500ms
    // and triggers pointercancel — ignoring it lets the 600ms timer complete
    t.addEventListener('contextmenu', e => e.preventDefault());
    t.addEventListener('dblclick',    () => openListModal(t.dataset.lid));
  });
  tabs.querySelector('#btn-new').addEventListener('click', () => {
    modal({
      title: '新しいリスト',
      placeholder: 'リスト名',
      onSave(name) {
        const id = uid();
        s.lists.push({ id, name });
        s.items[id] = [];
        s.active = id;
        save(); render();
      }
    });
  });
}

function openListModal(lid) {
  const list = s.lists.find(l => l.id === lid);
  if (!list) return;
  modal({
    title: 'リストを編集',
    value: list.name,
    onSave(name) { list.name = name; save(); render(); },
    onDelete: s.lists.length > 1 ? () => {
      s.lists = s.lists.filter(l => l.id !== lid);
      delete s.items[lid];
      if (s.active === lid) s.active = s.lists[0]?.id ?? null;
      save(); render();
    } : null
  });
}

function renderMain() {
  const main = document.getElementById('main');
  const lid = s.active;
  if (!lid) { main.innerHTML = ''; return; }

  const all = sorted(s.items[lid] ?? []);
  const checked   = all.filter(i =>  i.checked);
  const unchecked = all.filter(i => !i.checked);

  if (all.length === 0) {
    main.innerHTML = `<div class="empty">アイテムがありません<br>下の入力欄から追加してください</div>`;
    return;
  }

  let html = '';
  if (checked.length)   html += section('要購入', checked);
  if (unchecked.length) html += section('ストック', unchecked);
  html += `<div class="hint">タブを長押しでリスト名の編集・削除</div>`;
  main.innerHTML = html;

  // Events
  main.querySelectorAll('.item[data-iid]').forEach(el => {
    el.addEventListener('click', e => {
      if (e.target.closest('.item-more')) return;
      toggle(lid, el.dataset.iid);
    });
  });
  main.querySelectorAll('.item-more').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const iid = btn.dataset.iid;
      const item = s.items[lid].find(i => i.id === iid);
      if (!item) return;
      modal({
        title: 'アイテムを編集',
        value: item.text,
        onSave(text) { item.text = text; save(); render(); },
        onDelete() {
          s.items[lid] = s.items[lid].filter(i => i.id !== iid);
          save(); render();
        }
      });
    });
  });
}

function section(label, items) {
  return `<div class="section-label">${label}</div>` +
    `<div class="group">${items.map(itemHtml).join('')}</div>`;
}

function itemHtml(item) {
  const c    = item.uncheckHistory.length;
  const last = c ? fmtDate(item.uncheckHistory.at(-1)) : null;
  const meta = c ? `最終: ${last}　計${c}回` : '';
  return (
    `<div class="item${item.checked ? ' checked' : ''}" data-iid="${item.id}">` +
      `<div class="item-icon">${item.checked ? '✓' : '○'}</div>` +
      `<div class="item-body">` +
        `<div class="item-text">${esc(item.text)}</div>` +
        (meta ? `<div class="item-meta">${meta}</div>` : '') +
      `</div>` +
      `<button class="item-more" data-iid="${item.id}">···</button>` +
    `</div>`
  );
}

// ── Helpers ──────────────────────────────────────────────
function fmtDate(iso) {
  const d = new Date(iso);
  return `${d.getMonth() + 1}/${d.getDate()}`;
}

function esc(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Add form ─────────────────────────────────────────────
document.getElementById('add-form').addEventListener('submit', e => {
  e.preventDefault();
  const inp = document.getElementById('add-input');
  const text = inp.value.trim();
  if (!text || !s.active) return;
  const newId = uid();
  s.items[s.active].push({ id: newId, text, checked: true, uncheckHistory: [] });
  save(); render();
  inp.value = '';
  inp.focus();
  requestAnimationFrame(() => {
    const el = document.querySelector(`[data-iid="${newId}"]`);
    const main = document.getElementById('main');
    if (!el || !main) return;
    const elRect = el.getBoundingClientRect();
    const mainRect = main.getBoundingClientRect();
    if (elRect.bottom > mainRect.bottom) {
      main.scrollTop += elRect.bottom - mainRect.bottom + 16;
    }
  });
});

// ── Init ─────────────────────────────────────────────────
load();
render();
</script>
</body>
</html>
